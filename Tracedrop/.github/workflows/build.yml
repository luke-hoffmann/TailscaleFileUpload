name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # attach the exe to a GitHub release when a v* tag is pushed

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test the engine
        run: dotnet test Tracedrop.Core.Tests -c Release

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch AI models
        run: |
          pip install --quiet onnxruntime numpy
          python tools/models/fetch_models.py
      - name: Test
        run: dotnet test Tracedrop.Core.Tests -c Release
      - name: Publish one portable exe
        run: dotnet publish TracedropApp -c Release -o dist
      - name: Show size
        shell: pwsh
        run: Get-Item dist/Tracedrop.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length / 1MB, 1)}}
      - uses: actions/upload-artifact@v4
        with:
          name: Tracedrop
          path: dist/Tracedrop.exe
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Tracedrop.exe

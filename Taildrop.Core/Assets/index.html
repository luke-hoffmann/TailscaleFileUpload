<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f2">
  <title>Send to computer</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header>
      <div class="mark" aria-hidden="true">T</div>
      <div><h1>Send to computer</h1><p>Private over Tailscale</p></div>
      <span id="connection" class="connection"><i></i><span>Connected</span></span>
    </header>
    <section class="send-card">
      <div class="arrow" aria-hidden="true">&#8593;</div>
      <h2>Choose files</h2>
      <p>Select one or more files from this phone. They go straight to the computer.</p>
      <button id="choose" class="choose" type="button">Select files</button>
      <input id="files" type="file" multiple hidden>
    </section>
    <section id="transfers" class="transfers" aria-live="polite" hidden>
      <div class="transfers-heading"><h3>Transfers</h3><span id="summary"></span></div>
      <div id="queue"></div>
    </section>
    <p class="keep-open">Keep this page open until every file says Sent.</p>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
